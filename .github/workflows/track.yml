name: Update data

on:
  schedule:
    # Each run starts the next one about an hour after it began (last step below). GitHub delays
    # or drops many scheduled runs, so these crons are only a backup that restarts the chain.
    # collect.py works out what is due, so an extra run only does work that is due.
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch: {}

concurrency:
  group: tracker
  cancel-in-progress: false

permissions:
  actions: write   # to start the next run
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
    steps:
      - name: Note start time
        run: echo "RUN_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect
        id: collect
        run: python tracker/collect.py

      # The steps below run even if Collect reported a failure, so whatever it
      # gathered is saved and the dashboard stays up.
      - name: Save data
        if: ${{ !cancelled() }}
        run: |
          git config user.name "tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -q -m "Snapshot $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git pull --rebase -q
          git push -q

      # The dashboard is published straight from this run, so its large data files
      # never go into the repo history.
      - name: Build dashboard
        if: ${{ !cancelled() }}
        run: python tracker/build_dashboard.py

      - uses: actions/configure-pages@v5
        if: ${{ !cancelled() }}

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() }}
        with:
          path: site

      - uses: actions/deploy-pages@v4
        if: ${{ !cancelled() }}

      # Keep the hourly chain going: wait until about an hour after this run started, then start
      # the next one. (Only one run can wait in the queue, so this never builds up duplicates.)
      - name: Start the next run in an hour
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wait=$(( 3540 - ($(date +%s) - RUN_START) ))
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          gh workflow run track.yml --repo "$GITHUB_REPOSITORY" --ref main
