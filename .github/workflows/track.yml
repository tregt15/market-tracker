name: Update data

on:
  schedule:
    - cron: "17 * * * *"   # every hour at minute 17; charts and the scan run every 3rd hour
  workflow_dispatch: {}

concurrency:
  group: tracker
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect
        id: collect
        run: python tracker/collect.py

      # The steps below run even if Collect reported a failure, so whatever it
      # gathered is saved and the dashboard stays up.
      - name: Save data
        if: ${{ !cancelled() }}
        run: |
          git config user.name "tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -q -m "Snapshot $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git pull --rebase -q
          git push -q

      # The dashboard is published straight from this run, so its large data files
      # never go into the repo history.
      - name: Build dashboard
        if: ${{ !cancelled() }}
        run: python tracker/build_dashboard.py

      - uses: actions/configure-pages@v5
        if: ${{ !cancelled() }}

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() }}
        with:
          path: site

      - uses: actions/deploy-pages@v4
        if: ${{ !cancelled() }}
