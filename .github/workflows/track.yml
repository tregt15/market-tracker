name: Update data

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours, at minute 17
  workflow_dispatch: {}

concurrency:
  group: tracker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect
        run: python tracker/collect.py

      - name: Build dashboard data
        run: python tracker/build_dashboard.py

      - name: Save data
        run: |
          git config user.name "tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data.json
          git commit -m "Snapshot $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git pull --rebase
          git push
